<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;scroll-behavior:smooth}body{font:14px/1.6 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}h1,h2,h3{margin:0;letter-spacing:-.025em;font-weight:700}a{color:var(--p);text-decoration:none}a:hover{text-decoration:underline}.mu{color:var(--mu)}.sp{flex:1}

input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid #d5deeb;border-radius:9px;background:#fff;color:var(--tx);transition:border-color .15s,box-shadow .15s}input:hover,select:hover,textarea:hover{border-color:#aebfda}input:focus,select:focus,textarea:focus{outline:0;border-color:#5c91df;box-shadow:0 0 0 3px rgba(56,120,213,.13)}label{display:block;font-weight:650;font-size:12px;color:#42516a;margin-bottom:5px}label i{color:var(--er);font-style:normal}

#nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#a78bfa;padding:22px 14px 6px;font-weight:700}.main{margin-left:258px;flex:1;min-width:0}header{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 25px;position:sticky;top:0;z-index:10;flex-wrap:wrap;min-height:66px}header h1{font-size:19px;color:#172b4d;font-weight:750}#burger{display:none}.who{font-size:12px;color:#52627b;display:flex;align-items:center;gap:7px}header .btn{font-size:12px;padding:7px 11px}main{padding:25px 27px;max-width:1700px;margin:0 auto}#scrim{display:none}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px;align-items:center}.tools input[type=search]{max-width:280px;min-width:190px}.tools select{width:auto;max-width:200px}.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:#fff}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #f1f5f9;vertical-align:middle}th{background:#f8fafc;color:#475569;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1}tbody tr{transition:background .15s}tbody tr:hover{background:#f8fafc}tr:last-child td{border-bottom:0}td.act{white-space:normal;text-align:right;min-width:280px}
td.act .btn{margin:2px 1px}.empty{padding:40px 20px;text-align:center;color:var(--mu);background:#fbfcfe;border:1px dashed var(--bd);border-radius:10px}.pager{display:flex;align-items:center;gap:9px;margin-top:14px;justify-content:flex-end;font-size:12px;color:var(--mu)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px;margin-bottom:21px}.stat{display:block;text-decoration:none;color:#4a5870;background:#fff;border:1px solid var(--bd);border-radius:13px;padding:17px;box-shadow:var(--shadow);transition:transform .16s,border-color .16s,box-shadow .16s;font-size:12px;font-weight:550}.stat:hover{border-color:#9bbbe9;transform:translateY(-2px);box-shadow:0 9px 22px rgba(28,76,142,.1)}.stat b{display:block;font-size:29px;line-height:1.2;color:var(--p);font-weight:800;letter-spacing:-.04em;margin-bottom:7px}.stat.wr b{color:var(--wr)}h3{font-size:15px;margin:5px 0 12px;color:#233653;font-weight:750}#map{height:440px;border-radius:12px;border:1px solid var(--bd);margin-bottom:14px;z-index:1;box-shadow:var(--shadow)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 12px}

#nav a{gap:11px}#nav a:before{content:none}.nav-ico{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;border-radius:8px;background:rgba(255,255,255,.1);font-size:16px;margin-right:4px}.nav-label{white-space:nowrap}
