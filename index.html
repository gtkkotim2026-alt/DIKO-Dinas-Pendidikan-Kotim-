<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIKO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--p:#185abc;--p2:#eaf2ff;--p3:#d5e5ff;--navy:#102a56;--bg:#f3f6fb;--surface:#fff;--tx:#182338;--mu:#69778d;--bd:#e3e9f2;--ok:#12805c;--okb:#e5f6ef;--wr:#a85b08;--wrb:#fff3dc;--er:#bd2834;--erb:#ffebed;--r:14px;--shadow:0 5px 18px rgba(20,48,90,.055);--shadow-lg:0 18px 48px rgba(16,42,86,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;scroll-behavior:smooth}body{font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}h1,h2,h3{margin:0;letter-spacing:-.02em}a{color:var(--p)}.mu{color:var(--mu)}.sp{flex:1}
#bar{display:none;position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:linear-gradient(90deg,#185abc,#74a9ff,#185abc);background-size:200%;animation:bar 1s linear infinite}@keyframes bar{to{background-position:-200% 0}}
.btn{font:inherit;font-weight:600;border:1px solid var(--p);background:linear-gradient(135deg,#2167c9,#164fa8);color:#fff;border-radius:9px;padding:9px 15px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 5px rgba(24,90,188,.12);transition:transform .16s,box-shadow .16s,filter .16s}.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 5px 12px rgba(24,90,188,.18)}.btn:active{transform:translateY(0)}.btn:disabled{opacity:.55;cursor:wait;transform:none}.btn.sec{background:#fff;color:#34445e;border-color:var(--bd);box-shadow:none}.btn.sec:hover{background:#f5f8fd;border-color:#b8c9e4}.btn.dan{background:#fff;color:var(--er);border-color:#f1c6cb;box-shadow:none}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid #d5deeb;border-radius:9px;background:#fff;color:var(--tx);transition:border-color .15s,box-shadow .15s}input:hover,select:hover,textarea:hover{border-color:#aebfda}input:focus,select:focus,textarea:focus{outline:0;border-color:#5c91df;box-shadow:0 0 0 3px rgba(56,120,213,.13)}label{display:block;font-weight:650;font-size:12px;color:#42516a;margin-bottom:5px}label i{color:var(--er);font-style:normal}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:19px;margin-bottom:17px;box-shadow:var(--shadow)}.card.err{color:var(--er);background:var(--erb);border-color:#f5cbd0}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:650;background:#eef2f7;color:#43516a;white-space:nowrap}.badge.ok{background:var(--okb);color:var(--ok)}.badge.wr{background:var(--wrb);color:var(--wr)}.badge.er{background:var(--erb);color:var(--er)}
/* authentication */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,rgba(116,169,255,.24),transparent 38%),radial-gradient(ellipse at 90% 85%,rgba(24,90,188,.13),transparent 36%),linear-gradient(135deg,#edf4ff,#f7f9fd)}.authbox{width:100%;max-width:570px;margin:0;padding:30px;border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.9)}.authbox h2{font-size:25px;color:var(--navy);font-weight:800;letter-spacing:-.04em}.authbox>.mu{margin-top:3px;font-size:13px}.tabs{display:flex;gap:5px;margin:22px 0 18px;border-bottom:1px solid var(--bd)}.tabs button{font:inherit;font-weight:600;background:none;border:0;padding:10px 15px;cursor:pointer;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-1px}.tabs button.on{color:var(--p);border-color:var(--p)}.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg .full{grid-column:1/-1}.msg{padding:11px 13px;border-radius:9px;margin:13px 0;background:var(--erb);color:var(--er);border:1px solid #f4cdd1}.msg.ok{background:var(--okb);color:var(--ok);border-color:#ccebdc}.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
/* application shell */
.app{display:flex;min-height:100vh}#side{width:258px;background:linear-gradient(180deg,#102a56 0%,#122f61 55%,#0d2348 100%);color:#d8e4f8;padding:19px 13px;position:fixed;top:0;bottom:0;left:0;overflow:auto;z-index:20;box-shadow:5px 0 24px rgba(16,42,86,.09)}.brand{font-weight:800;font-size:20px;color:#fff;padding:7px 12px 22px;letter-spacing:-.035em}.brand:before{content:"D";display:inline-grid;place-items:center;width:34px;height:34px;margin-right:9px;vertical-align:middle;border-radius:10px;background:linear-gradient(135deg,#68a5ff,#2d6fce);box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:18px}.brand small{display:block;font-weight:450;font-size:11px;color:#a9bddf;margin:5px 0 0 44px;letter-spacing:.01em}#nav a{display:flex;align-items:center;min-height:39px;padding:9px 12px;border-radius:9px;color:#d0dcf1;text-decoration:none;margin:3px 0;font-size:13px;font-weight:520;transition:background .15s,color .15s,transform .15s}#nav a:before{content:"";width:6px;height:6px;border-radius:50%;background:#7994bd;margin-right:11px;flex:none}#nav a:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateX(2px)}#nav a.on{background:linear-gradient(100deg,#2369cb,#1a56ae);color:#fff;font-weight:700;box-shadow:0 5px 14px rgba(0,0,0,.16)}#nav a.on:before{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15)}#nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8fa8d1;padding:18px 12px 5px;font-weight:750}.main{margin-left:258px;flex:1;min-width:0}header{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 25px;position:sticky;top:0;z-index:10;flex-wrap:wrap;min-height:66px}header h1{font-size:19px;color:#172b4d;font-weight:750}#burger{display:none}.who{font-size:12px;color:#52627b;display:flex;align-items:center;gap:7px}header .btn{font-size:12px;padding:7px 11px}main{padding:25px 27px;max-width:1700px;margin:0 auto}#scrim{display:none}
/* tables and data */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px;align-items:center}.tools input[type=search]{max-width:280px;min-width:190px}.tools select{width:auto;max-width:200px}.tw{overflow:auto;border:1px solid var(--bd);border-radius:11px;background:#fff}table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #edf0f5;vertical-align:top}th{background:#f4f7fc;color:#43516a;font-weight:750;white-space:nowrap;position:sticky;top:0;z-index:1}tbody tr{transition:background .12s}tbody tr:hover{background:#f8fbff}tr:last-child td{border-bottom:0}td.act{white-space:nowrap;text-align:right}.empty{padding:40px 20px;text-align:center;color:var(--mu);background:#fbfcfe;border:1px dashed var(--bd);border-radius:10px}.pager{display:flex;align-items:center;gap:9px;margin-top:14px;justify-content:flex-end;font-size:12px;color:var(--mu)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px;margin-bottom:21px}.stat{display:block;text-decoration:none;color:#4a5870;background:#fff;border:1px solid var(--bd);border-radius:13px;padding:17px;box-shadow:var(--shadow);transition:transform .16s,border-color .16s,box-shadow .16s;font-size:12px;font-weight:550}.stat:hover{border-color:#9bbbe9;transform:translateY(-2px);box-shadow:0 9px 22px rgba(28,76,142,.1)}.stat b{display:block;font-size:29px;line-height:1.2;color:var(--p);font-weight:800;letter-spacing:-.04em;margin-bottom:7px}.stat.wr b{color:var(--wr)}h3{font-size:15px;margin:5px 0 12px;color:#233653;font-weight:750}#map{height:440px;border-radius:12px;border:1px solid var(--bd);margin-bottom:14px;z-index:1;box-shadow:var(--shadow)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 12px}
/* modal and feedback */
.modal{position:fixed;inset:0;background:rgba(12,29,57,.58);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}.modal .box{background:#fff;border:1px solid rgba(255,255,255,.7);border-radius:16px;width:100%;max-width:680px;box-shadow:var(--shadow-lg);overflow:hidden}.mh{display:flex;justify-content:space-between;align-items:center;padding:17px 21px;border-bottom:1px solid var(--bd);font-size:16px;color:#203653;background:#fbfcff}.x{font-size:24px;line-height:1;background:none;border:0;cursor:pointer;color:var(--mu);padding:2px 5px;border-radius:7px}.x:hover{background:#edf2f8;color:#243b5c}.mb{padding:21px}.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 21px;border-top:1px solid var(--bd);background:#fbfcff}.merr{margin:0 21px 15px;padding:11px 13px;border-radius:9px;background:var(--erb);color:var(--er);border:1px solid #f4cdd1}dl{display:grid;grid-template-columns:170px 1fr;gap:9px 14px;margin:0}dt{color:var(--mu);font-size:12px}dd{margin:0;word-break:break-word;font-weight:550}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}#toast div{background:#1d2c43;color:#fff;padding:11px 17px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13px;animation:toastIn .2s ease-out}#toast div.er{background:#b42332}#toast div.ok{background:#087a56}@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:1400px){main{padding:30px 34px}.cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media(max-width:900px){#side{transform:translateX(-105%);transition:transform .22s ease;box-shadow:12px 0 30px rgba(0,0,0,.18)}body.nav-open #side{transform:translateX(0)}body.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(8,22,44,.45);z-index:15}.main{margin-left:0}#burger{display:inline-block}header{padding:10px 14px;gap:8px}header h1{font-size:17px}main{padding:15px}.fg{grid-template-columns:1fr}dl{grid-template-columns:1fr;gap:3px}dd{margin-bottom:9px}.who{order:5;width:100%;padding-top:4px;border-top:1px solid #edf0f5}.cards{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}}
@media(max-width:520px){.auth{padding:12px}.authbox{padding:21px 17px;border-radius:16px}.authbox h2{font-size:22px}.tools{gap:7px}.tools input[type=search]{max-width:none;width:100%}.tools select{max-width:none;flex:1;min-width:130px}.tools .sp{display:none}.tools .btn{flex:1}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat b{font-size:24px}header{min-height:58px}header .btn{padding:6px 8px;font-size:11px}main{padding:12px}.card{padding:14px}.modal{padding:12px 8px}.mb{padding:15px}.mh{padding:14px 16px}.mf{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* DIKO dashboard & navigation enhancement */
.brand{position:relative;padding-right:38px}.brand:before{content:none}.brand .brand-logo{display:none}
.nav-toggle{position:absolute;right:5px;top:8px;width:27px;height:27px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.08);color:#fff;font-size:19px;line-height:1;cursor:pointer}
#nav a{gap:11px}#nav a:before{content:none}.nav-ico{display:inline-grid;place-items:center;width:22px;height:22px;flex:none;border-radius:7px;background:rgba(255,255,255,.09);font-size:14px;color:#cfe0ff}.nav-label{white-space:nowrap}
body.nav-compact #side{width:78px;padding-left:10px;padding-right:10px}body.nav-compact .main{margin-left:78px}body.nav-compact .brand{font-size:0;padding:7px 0 22px}body.nav-compact .brand:after{content:'D';display:grid;place-items:center;width:38px;height:38px;margin:auto;border-radius:11px;background:linear-gradient(135deg,#68a5ff,#2d6fce);font-size:20px}body.nav-compact .brand small,body.nav-compact .nav-label,body.nav-compact #nav .grp{display:none}body.nav-compact .nav-toggle{right:0;top:51px}body.nav-compact #nav a{justify-content:center;padding:9px 5px}body.nav-compact .nav-ico{width:35px;height:35px;font-size:16px}
.dash-welcome{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:25px 28px;margin-bottom:22px;border-radius:17px;color:#fff;background:linear-gradient(115deg,#102a56,#1c58a8 70%,#347bd0);box-shadow:0 12px 28px rgba(20,67,132,.17)}.dash-welcome h2{font-size:23px;letter-spacing:-.035em;margin:5px 0}.dash-welcome p{margin:0;color:#d6e5fa;font-size:13px}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:750;color:#a9c9f7}.dash-date{text-align:right;font-size:10px;letter-spacing:.1em;color:#c9defb;line-height:1.8}.dash-date b{font-size:22px;color:#fff;letter-spacing:.03em}
.dash-section{margin:0 0 23px}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:13px}.section-heading h3{font-size:17px;margin:0 0 3px}.section-heading p{font-size:12px;margin:0}.text-link{font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.dash-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:14px}.kpi-card{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--bd);border-radius:13px;padding:16px;box-shadow:var(--shadow)}.kpi-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#eaf2ff;color:#185abc;font-size:21px}.kpi-card b{display:block;font-size:25px;line-height:1.2;color:#1c3761;letter-spacing:-.04em}.kpi-card small{display:block;color:var(--mu);font-size:11px;margin-top:4px}
.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.dash-panel{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.panel-title b{font-size:13px;color:#263b5b}.panel-title span{font-size:10px}.legend{display:flex;gap:14px;font-size:10px;color:var(--mu);margin-bottom:13px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.legend-dot.negeri{background:#2878d0}.legend-dot.swasta{background:#f0a43a}.bar-row{margin:13px 0}.bar-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:6px}.bar-label span{color:var(--mu)}.stack-track,.mini-track,.teacher-track{height:10px;background:#edf1f7;border-radius:20px;overflow:hidden;display:flex}.stack{height:100%;display:block}.stack.negeri{background:#2878d0}.stack.swasta{background:#f0a43a}.bar-values{display:flex;gap:15px;font-size:10px;color:var(--mu);margin-top:5px}
.student-list{display:flex;flex-direction:column;gap:15px}.student-item{display:flex;align-items:center;gap:11px}.student-mark{display:grid;place-items:center;width:39px;height:39px;border-radius:11px;font-size:11px;font-weight:800}.student-mark.m0{background:#e9f2ff;color:#2167c9}.student-mark.m1{background:#e8f7f2;color:#13815e}.student-mark.m2{background:#fff3e4;color:#b86a13}.student-info{flex:1;min-width:0}.student-info>div:first-child{display:flex;justify-content:space-between;gap:8px;align-items:center}.student-info b{font-size:14px}.student-info small{font-size:10px;color:var(--mu)}.mini-track{height:6px;margin-top:7px}.mini-track i{display:block;background:linear-gradient(90deg,#2b72cc,#75a9ee);border-radius:20px}.student-total{display:flex;justify-content:space-between;border-top:1px solid var(--bd);padding-top:13px;margin-top:16px;font-size:11px;color:var(--mu)}.student-total b{font-size:17px;color:#1c3761}
.teacher-panel{display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:center}.teacher-total{border-right:1px solid var(--bd);padding:12px 18px 12px 5px}.teacher-total b{display:block;font-size:32px;letter-spacing:-.04em;color:#1c3761}.teacher-total span{font-size:11px;color:var(--mu)}.teacher-bars{display:flex;flex-direction:column;gap:13px}.teacher-label{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11px}.teacher-label strong{margin-left:auto}.teacher-dot{width:8px;height:8px;border-radius:50%}.t0{background:#2878d0}.t1{background:#26a69a}.t2{background:#8b72d6}.t3{background:#efa33b}.teacher-track{height:7px}.teacher-track i{display:block;height:100%;border-radius:20px}
.roster-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.roster-summary>div{padding:11px;border:1px solid var(--bd);border-radius:10px;background:#f8faff}.roster-summary b{display:block;font-size:16px;color:#1d4f91;overflow-wrap:anywhere}.roster-summary span{font-size:10px;color:var(--mu)}
@media(max-width:1050px){.dash-grid{grid-template-columns:1fr}.dash-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){body.nav-compact #side{width:258px}body.nav-compact .main{margin-left:0}body.nav-compact .brand{font-size:20px;padding:7px 12px 22px}body.nav-compact .brand:after{content:none}body.nav-compact .brand small,body.nav-compact .nav-label,body.nav-compact #nav .grp{display:initial}body.nav-compact #nav a{justify-content:flex-start;padding:9px 12px}body.nav-compact .nav-ico{width:22px;height:22px}body.nav-compact .nav-toggle{display:none}}
@media(max-width:620px){.dash-welcome{padding:19px;align-items:flex-start}.dash-welcome h2{font-size:19px}.dash-date{font-size:9px}.dash-kpis{grid-template-columns:1fr}.kpi-card{padding:12px}.dash-grid{grid-template-columns:1fr}.teacher-panel{grid-template-columns:1fr;gap:12px}.teacher-total{border-right:0;border-bottom:1px solid var(--bd);padding:0 0 12px}.roster-summary{grid-template-columns:1fr 1fr}.section-heading{align-items:flex-start;flex-direction:column}}

</style>
</head>
<body>
<div id="bar"></div>
<div id="root"></div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
